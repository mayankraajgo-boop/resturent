<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - MR Restaurant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-container">

    <aside class="sidebar">
        <h2 class="logo">MR Admin</h2>

        <ul>
            <li onclick="showSection('dashboard')" class="active">Dashboard</li>
            <li onclick="showSection('menuSection')">Menu</li>
            <li onclick="showSection('ordersSection')">Orders</li>
        </ul>

        <button class="logout-btn">Logout</button>
    </aside>

    <div class="main-content">

        <!-- DASHBOARD -->
        <div id="dashboard" class="section">

            <h2>📊 Dashboard Overview</h2>

            <div class="stats">
                <div class="card green">
                    <h4>💰 Total Revenue</h4>
                    <p id="totalRevenue">₹ 0</p>
                </div>

                <div class="card purple">
                    <h4>📦 Total Orders</h4>
                    <p id="totalOrders">0</p>
                </div>

                <div class="card blue">
                    <h4>📈 Avg Order Value</h4>
                    <p id="avgRevenue">₹ 0</p>
                </div>

                <div class="card red">
                    <h4>⏳ Pending Orders</h4>
                    <p id="pendingOrders">0</p>
                </div>
            </div>

            <!-- NEW: Today's Stats -->
            <div class="today-stats">
                <h3>Today's Performance</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span>Orders Today</span>
                        <strong id="todayOrders">0</strong>
                    </div>
                    <div class="stat-item">
                        <span>Revenue Today</span>
                        <strong id="todayRevenue">₹ 0</strong>
                    </div>
                    <div class="stat-item">
                        <span>Completed</span>
                        <strong id="completedToday">0</strong>
                    </div>
                </div>
            </div>

           <div class="charts">
    <div>
        <canvas id="salesChart"></canvas>
    </div>
    <div>
        <canvas id="ordersChart"></canvas>
    </div>
</div>

        </div>

        <!-- MENU MANAGEMENT -->
        <div id="menuSection" class="section" style="display:none;">

            <h3>Menu Management</h3>

            <div class="form-box">
                <input type="text" id="itemName" placeholder="Food Name">
                <input type="number" id="itemPrice" placeholder="Price">
                <input type="text" id="itemCategory" placeholder="Category">
                <input type="file" id="itemImage">

                <button id="addBtn" onclick="addItem()">Add Item</button>
                <button id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
            </div>

            <div id="adminItems"></div>

        </div>

        <!-- ORDERS -->
        <div id="ordersSection" class="section" style="display:none;">
            <h3>📋 Orders Management</h3>
            
            <!-- Search & Filter -->
            <div class="order-filters">
                <input type="text" id="searchOrder" placeholder="🔍 Search by name, phone, or order ID..." onkeyup="filterOrders()">
                <select id="statusFilter" onchange="filterOrders()">
                    <option value="">All Status</option>
                    <option value="Processing">Processing</option>
                    <option value="Cooking">Cooking</option>
                    <option value="Out for Delivery">Out for Delivery</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>

            <div id="ordersList"></div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
